/* Start-flow mockups (Neues Video, Untertitel, Projekte, Vorschau).
   One stylesheet for all five pages; build.py inlines it with the fonts.
   Tokens: web/src/app/globals.css. Shell: the S1-S3 settings mockups.
   Type scale: 11 tabs and tags, 12.5 meta, notes and hints, 14 names and
   controls, 15 row labels and menu, 16 body, buttons and titles, 17 top bar,
   22 / 40 headings. Radii: 8 small, 12 buttons and controls, 16 cards and
   frames, full for pills. */

:root{
  --surface-0:#0b0a10;--surface-1:#131217;--surface-2:#1b1a22;--surface-tint:#24222d;
  --text-strong:#f5f3fa;--text-body:#c4c0d0;--text-muted:#8b869a;--text-faint:#85809a;
  --border:#23222b;--border-hover:#3a3849;--border-strong:#545267;
  --brand:#8b5cf6;--brand-solid:#7c3aed;--brand-solid-hover:#6d28d9;--brand-hover:#a78bfa;
  --brand-tint:rgba(139,92,246,.12);--brand-strong:#ddd6fe;--brand-glow:rgba(139,92,246,.4);
  --accent:#ec4899;--danger:#ef6b57;--warn:#f59e0b;--success:#10b981;
  --cmd-start:#5a9fff;--cmd-cut:#f26e6e;--cmd-keep:#4ecc77;--cmd-finish:#b979ff;--cmd-stopgo:#f5b54d;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 8px 20px rgba(0,0,0,.35);
  --ease-out:cubic-bezier(.16,1,.3,1);--ease-move:cubic-bezier(.77,0,.175,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
  --topbar:56px;--tabbar:65px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--border-strong) transparent;background:var(--surface-0)}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--surface-0);color:var(--text-body);font-size:16px;line-height:1.5;min-height:100dvh;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 40% at 85% -5%,rgba(139,92,246,.16),transparent 70%),
             radial-gradient(45% 30% at 0% 100%,rgba(236,72,153,.07),transparent 70%)}
::selection{background:rgba(139,92,246,.4);color:var(--text-strong)}
button,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
a{color:var(--brand-strong);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--brand-hover);outline-offset:2px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon{width:1.2em;height:1.2em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{color:var(--text-strong);letter-spacing:-.02em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.cmd-cut{color:var(--cmd-cut);font-weight:600}
@keyframes soft-pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes skel{to{transform:translateX(100%)}}

/* ---------- app shell ---------- */
.app{position:relative;z-index:1}
.sidebar{display:none}
.topbar{position:sticky;top:0;z-index:20;height:var(--topbar);display:flex;align-items:center;gap:10px;padding:0 16px;
  transition:background-color .2s ease,box-shadow .2s ease}
.scrolled .topbar,.scrolled .upl-top{background:var(--surface-0)}
.scrolled .topbar{box-shadow:0 1px 0 var(--border)}
.scrolled.p2 .topbar{box-shadow:none}
.scrolled.p2 .upl-top{box-shadow:0 1px 0 var(--border)}
.topbar .t{font-weight:700;color:var(--text-strong);font-size:17px;letter-spacing:-.015em}
main{position:relative;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
.page-h{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(19,18,23,.92);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--border)}
.tab{text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;
  font-size:11px;font-weight:600;color:var(--text-muted);border-radius:12px;transition:color .15s ease,opacity .12s ease}
/* every icon sits in the 30px slot of the + bubble, so the four labels share one line */
.tab > .icon{width:22px;height:22px;margin:4px 0}
.tab:active{opacity:.7}
.tab[aria-current="page"]{color:var(--brand-strong)}
.tab[aria-current="page"] > .icon{color:var(--brand-hover)}
/* Upload: the same tint bubble on every screen. The page's own action keeps
   the one filled violet; "you are here" shows in the label, as on every tab. */
.tab-up .bubble{width:40px;height:30px;border-radius:999px;display:grid;place-items:center;
  background:var(--brand-tint);color:var(--brand-strong);box-shadow:inset 0 0 0 1px rgba(139,92,246,.42);
  transition:background-color .15s ease,transform .16s var(--ease-out)}
.tab-up:active{opacity:1}
.tab-up:active .bubble{transform:scale(.94)}
.tab-up .bubble .icon{width:20px;height:20px}

@media (min-width:960px){
  .app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100dvh}
  .topbar,.tabbar{display:none}
  .sidebar{display:flex;flex-direction:column;gap:4px;padding:22px 14px;border-right:1px solid var(--border);
    min-height:100dvh;background:rgba(11,10,16,.5);position:sticky;top:0;align-self:start;height:100dvh}
  .brand{display:flex;align-items:center;gap:8px;padding:2px 10px 22px;font-weight:700;font-size:19px;color:var(--text-strong);letter-spacing:-.02em}
  .side-up{text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:12px;
    background:var(--brand-tint);color:var(--text-body);box-shadow:inset 0 0 0 1px rgba(139,92,246,.3);
    font-weight:600;font-size:15px;margin-bottom:18px;
    transition:background-color .15s ease,color .15s ease,box-shadow .15s ease,transform .16s var(--ease-out)}
  .side-up .icon{width:18px;height:18px;color:var(--brand-hover)}
  .side-up:hover{background:rgba(139,92,246,.18);color:var(--text-strong)}
  .side-up:active{transform:scale(.97)}
  .side-up[aria-current="page"]{background:rgba(139,92,246,.2);color:var(--brand-strong);box-shadow:inset 0 0 0 1px var(--brand)}
  .side-link{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:10px;color:var(--text-body);
    font-size:15px;font-weight:500;text-decoration:none;transition:background-color .15s ease,color .15s ease}
  .side-link .icon{width:19px;height:19px;color:var(--text-muted)}
  .side-link:hover{background:var(--surface-1);color:var(--text-strong)}
  .side-link[aria-current="page"]{background:var(--brand-tint);color:var(--brand-strong)}
  .side-link[aria-current="page"] .icon{color:var(--brand-hover)}
  main{padding:48px 56px 72px}
  .page-h{position:static;width:auto;height:auto;overflow:visible;clip:auto;white-space:normal;
    font-size:40px;line-height:1.1;font-weight:800;letter-spacing:-.03em}
}

/* ---------- buttons, switch ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 24px;border-radius:12px;
  font-size:16px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;user-select:none;-webkit-user-select:none;
  transition:background-color .15s ease,color .15s ease,transform .16s var(--ease-out)}
.btn:not([aria-disabled="true"]):active{transform:scale(.97)}
.btn[aria-disabled="true"]{cursor:default}
.btn .icon{width:19px;height:19px}
.btn-primary{background:var(--brand-solid);color:#fff}
.btn-tint{background:var(--brand-tint);color:var(--brand-strong)}
@media (hover:hover) and (pointer:fine){
  .btn-primary:not([aria-disabled="true"]):hover{background:var(--brand-solid-hover)}
  .btn-tint:not([aria-disabled="true"]):hover{background:rgba(139,92,246,.19)}
}
/* working: a soft shimmer runs through the tinted button (skeleton, brand) */
.btn.working{overflow:hidden}
.btn.working::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 30%,rgba(221,214,254,.1) 50%,transparent 70%);
  transform:translateX(-100%);animation:skel 1.8s ease-in-out infinite}
.switch{position:relative;width:48px;height:28px;border-radius:999px;background:var(--surface-tint);border:1px solid var(--border-hover);
  flex:none;transition:background-color .2s ease,border-color .2s ease}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#e8e5f0;
  box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .22s var(--ease-out)}
[aria-checked="true"] > .switch{background:var(--brand-solid);border-color:var(--brand-solid)}
[aria-checked="true"] > .switch::after{transform:translateX(20px);background:#fff}

/* ---------- stand-in video frames (no real people) ---------- */
.scene-a{--scene:radial-gradient(55% 40% at 32% 30%,rgba(255,172,112,.55),transparent 70%),radial-gradient(70% 55% at 85% 90%,rgba(124,58,237,.5),transparent 70%),radial-gradient(40% 30% at 50% 58%,rgba(70,48,62,.9),transparent 75%),linear-gradient(165deg,#3b2b38,#16111a 70%)}
.scene-b{--scene:radial-gradient(60% 40% at 78% 22%,rgba(150,196,255,.45),transparent 70%),radial-gradient(50% 35% at 40% 60%,rgba(52,60,82,.9),transparent 75%),linear-gradient(170deg,#202838,#0e1118 75%)}
.scene-c{--scene:radial-gradient(55% 40% at 70% 28%,rgba(255,196,140,.42),transparent 70%),radial-gradient(60% 45% at 25% 78%,rgba(150,96,60,.55),transparent 72%),linear-gradient(170deg,#2b211b,#110d0b 75%)}
.scene-d{--scene:radial-gradient(55% 45% at 72% 28%,rgba(236,72,153,.42),transparent 70%),radial-gradient(60% 40% at 20% 80%,rgba(90,159,255,.28),transparent 70%),linear-gradient(170deg,#2a1531,#0f0a14 75%)}
.scene-e{--scene:radial-gradient(55% 40% at 40% 26%,rgba(255,214,160,.36),transparent 70%),radial-gradient(60% 45% at 75% 75%,rgba(80,190,140,.34),transparent 70%),linear-gradient(170deg,#1f2723,#0e1211 75%)}

.vframe{position:relative;overflow:hidden;container-type:inline-size;background:var(--scene);border-radius:16px;
  aspect-ratio:9/16;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.vframe::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.26));pointer-events:none}

/* ---------- captions: the twelve launch presets (web/src/lib/captions/presets.ts) ----------
   Sizes: --fs-frame is the preset's size x the frame's short side; --fs-band is the
   editor tile's crop of the caption band (StylePanel.tsx). Outlines: RING(w) is a
   ring of text-shadows at the preset's stroke width, the visible half of the
   engine's 2x lineWidth with round joins (draw.ts); HTML text-stroke would draw
   miter spikes. Shadows fall from the outlined text, as filter: drop-shadow. */

.band .cap{top:60%;left:4%;right:4%;transform:translateY(-50%);font-size:var(--fs-band)}
.cap .hl{color:var(--hl)}

  -webkit-box-decoration-break:clone;box-decoration-break:clone}

  --y:74%;--fs-frame:5.8cqw;--fs-band:9.8cqw}

/* ================= 1: Neues Video ================= */
/* Phones: one big card, the whole of it a button (nothing to drop on a phone).
   Desktop: the dashed drop zone. */
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;width:100%;
  min-height:max(380px,calc(100dvh - var(--topbar) - var(--tabbar) - 45px));padding:28px 20px;border-radius:16px;
  border:1px solid var(--border);background:var(--surface-1);text-align:center;
  transition:border-color .2s ease,background-color .2s ease}
.drop::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(64% 38% at 50% 42%,rgba(139,92,246,.16),transparent 72%)}
.ghost{position:relative;width:104px;aspect-ratio:9/16;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(180deg,rgba(139,92,246,.16),rgba(139,92,246,.06));box-shadow:inset 0 0 0 1.5px rgba(139,92,246,.42);
  color:var(--brand-hover);transition:transform .3s var(--ease-out)}
.ghost .icon{width:30px;height:30px}
.drop .btn{pointer-events:none;min-width:200px}
.drop .or{display:none;font-size:14px;color:var(--text-muted);margin-top:-10px}
.drop .limits{position:relative;margin-top:-10px;font-size:12.5px;line-height:1.4;color:var(--text-muted)}
.drop:active .btn{transform:scale(.97)}
.drop.over{border-color:var(--brand);background:var(--brand-tint)}
@media (hover:hover) and (pointer:fine){
  .drop:hover{border-color:var(--border-hover)}
  .drop:hover .ghost{transform:translateY(-3px)}
  .drop:hover .btn{background:var(--brand-solid-hover)}
}
@media (min-width:960px){
  .new{max-width:820px}
  .drop{margin-top:28px;min-height:440px;padding:32px 20px 40px;border:1.5px dashed rgba(84,82,103,.85);background:rgba(19,18,23,.6)}
  .drop .or{display:block}
  .drop .limits{margin-top:4px}
}
@media (min-width:960px) and (hover:hover) and (pointer:fine){.drop:hover{border-color:var(--border-strong)}}

/* ================= 2: Untertitel wählen ================= */
.upl-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;line-height:20px}
.upl-st{color:var(--text-body);font-weight:500;white-space:nowrap}
.upl-st .pct{color:var(--text-strong);font-weight:700;font-variant-numeric:tabular-nums}
.upl-end{display:flex;align-items:center;min-width:0}
.upl-file{color:var(--text-faint);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* cancel: a quiet x with a 44px hit area that takes no extra room */
.upl-x{display:grid;place-items:center;flex:none;width:44px;height:44px;margin:-12px -14px -12px -8px;border-radius:999px;
  color:var(--text-muted);transition:color .15s ease,opacity .12s ease}
.upl-x .icon{width:16px;height:16px}
.upl-x:active{opacity:.6}
@media (hover:hover) and (pointer:fine){.upl-x:hover{color:var(--text-strong)}}
.upl.done .upl-x{visibility:hidden}
.upl-track{margin-top:8px;height:3px;border-radius:3px;background:var(--surface-tint);overflow:hidden}
.upl-track i{display:block;height:100%;width:100%;border-radius:inherit;background:var(--cmd-start);
  transform-origin:left;transform:scaleX(var(--p,0));transition:transform .35s var(--ease-out)}
.upl-top{position:sticky;top:var(--topbar);z-index:19;padding:0 16px 12px;transition:background-color .2s ease,box-shadow .2s ease}
.p2 main{padding-top:14px;padding-bottom:calc(196px + env(safe-area-inset-bottom))}
.p2{scroll-padding-top:110px;scroll-padding-bottom:190px}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px;align-items:start}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;border-radius:12px;-webkit-touch-callout:none;
  transition:transform .16s var(--ease-out)}
.tile:active{transform:scale(.97)}
.tile:focus-visible{outline:none}
.tile:focus-visible .band{outline:2px solid var(--brand-hover);outline-offset:4px}
.band{position:relative;display:block;aspect-ratio:3/2;border-radius:12px;overflow:hidden;container-type:inline-size;
  background:var(--scene);background-size:118% 320%;background-position:50% 74%;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);transition:box-shadow .18s ease}
.band::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.tile[aria-checked="true"] .band{box-shadow:0 0 0 2px var(--surface-0),0 0 0 4px var(--brand)}
/* names wrap at their hyphen ("Untertitel-" / "Balken") instead of ending in "…" */
.tname{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;padding:0 2px;
  font-size:14px;line-height:18px;font-weight:600;color:var(--text-muted);transition:color .15s ease}
.tile[aria-checked="true"] .tname{color:var(--text-strong)}
/* "Zuletzt benutzt": a chip on the frame, so every tile keeps one name line */
.tag{position:absolute;z-index:3;top:6px;left:6px;padding:0 6px;border-radius:999px;pointer-events:none;
  font-size:11px;font-weight:600;line-height:16px;white-space:nowrap;color:var(--text-strong);background:rgba(11,10,16,.72)}
@media (hover:hover) and (pointer:fine){
  .tile:hover:not([aria-checked="true"]) .band{box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 0 0 1px var(--border-strong)}
  .tile:hover .tname{color:var(--text-body)}
}

.off{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin-top:14px;padding:0 14px;border-radius:12px;
  color:var(--text-body);font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px var(--border);
  transition:box-shadow .16s ease,color .16s ease,transform .16s var(--ease-out)}
.off:active{transform:scale(.98)}
.off .icon{width:18px;height:18px;color:var(--text-muted)}
.off[aria-checked="true"]{color:var(--text-strong);box-shadow:inset 0 0 0 2px var(--brand)}
.off[aria-checked="true"] .icon{color:var(--brand-hover)}
@media (hover:hover) and (pointer:fine){.off:hover:not([aria-checked="true"]){box-shadow:inset 0 0 0 1px var(--border-strong)}}

.more{margin-top:14px;border-top:1px solid var(--border)}
.disc{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 6px 0 2px;margin-top:4px;border-radius:8px;
  color:var(--text-body);font-size:14px;font-weight:600;transition:color .15s ease,opacity .12s ease}
.disc:active{opacity:.7}
.disc .icon{width:17px;height:17px;color:var(--text-muted);transition:transform .2s var(--ease-out)}
.more.open .disc .icon{transform:rotate(90deg)}
@media (hover:hover) and (pointer:fine){.disc:hover{color:var(--text-strong)}}
.more-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease-out)}
.more-panel > div{min-height:0;overflow:hidden}
.more.open .more-panel{grid-template-rows:1fr}
.more-panel .opts{opacity:0;transform:translateY(-6px);transition:opacity .2s ease,transform .3s var(--ease-out)}
.more.open .more-panel .opts{opacity:1;transform:none}
.no-anim .more-panel,.no-anim .more-panel .opts{transition:none}

.opts{margin:6px 0 4px;border:1px solid var(--border);border-radius:16px;background:var(--surface-1);overflow:hidden}
.orow{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:10px 16px;text-align:left;
  transition:background-color .14s ease}
.orow + .orow{border-top:1px solid var(--border)}
button.orow:not([aria-disabled="true"]):active,.lang-row:active{background:var(--surface-2)}
.orow .lbl{flex:1;min-width:0;color:var(--text-strong);font-size:15px;font-weight:600;line-height:1.35}
.orow .t{display:block}
.orow .sub{display:none;font-size:12.5px;font-weight:500;line-height:1.4;color:var(--text-muted);margin-top:3px}
.orow[data-note] .sub{display:block}
.orow[aria-disabled="true"]{cursor:default}
.orow[aria-disabled="true"] .t,.orow[aria-disabled="true"] .switch{opacity:.42}
.fmt-row{display:block;padding:14px 16px 16px}
.fmt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.fmt button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 6px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface-0);font-size:14px;font-weight:600;color:var(--text-body);
  transition:background-color .18s ease,border-color .18s ease,color .18s ease,transform .16s var(--ease-out)}
.fmt button:not([aria-disabled="true"]):active{transform:scale(.98)}
.fmt button[aria-checked="true"]{background:var(--brand-tint);border-color:var(--brand);color:var(--brand-strong)}
.fmt button[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
@media (hover:hover) and (pointer:fine){.fmt button:not([aria-checked="true"]):not([aria-disabled="true"]):hover{border-color:var(--border-hover)}}
.shape{border:2px solid currentColor;border-radius:3px;flex:none;opacity:.9}
.shape.v{width:11px;height:18px}.shape.h{width:19px;height:12px}.shape.o{width:15px;height:15px;border-style:dashed}
.fmt-hint{margin-top:8px;font-size:12.5px;line-height:1.4;color:var(--text-muted)}
.lang-row{cursor:pointer}
.lang-row .val{display:block;margin-top:2px;font-size:14px;font-weight:500;color:var(--text-muted)}
.lang-row .chev{width:16px;height:16px;color:var(--text-muted)}
.lang-row select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
.lang-row:has(select:focus-visible){outline:2px solid var(--brand-hover);outline-offset:-2px;border-radius:16px}
/* narrow phones: the chip keeps room on the frame; below 360px two columns */
@media (max-width:389px){.tag{top:5px;left:5px;padding:0 5px;font-size:10.5px}}
@media (max-width:359px){
  .tag{top:6px;left:6px;padding:0 6px;font-size:11px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fmt button{flex-direction:column;gap:5px;min-height:60px;padding:8px 4px}
}

/* the action: a bar above the tab bar on phones, under the preview on desktop */
.yours .vframe,.yours .upl{display:none}
.go{position:fixed;left:0;right:0;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom));z-index:25;padding:16px 16px 8px;
  background:linear-gradient(180deg,rgba(11,10,16,0),rgba(11,10,16,.94) 16px,var(--surface-0))}
.go .btn{width:100%}
.go .btn[data-state="wait"]{background:var(--brand-tint);color:var(--brand-strong)}
.go-note{margin-top:6px;min-height:16px;font-size:12.5px;line-height:16px;color:var(--text-muted);text-align:center;text-wrap:balance}

@media (min-width:960px){
  .upl-top{display:none}
  .p2 main{padding:48px 56px 72px}
  .pick{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:56px;max-width:1120px;align-items:start}
  .choose .page-h{margin-bottom:24px}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 14px}
  .off{max-width:calc(50% - 7px)}
  .opts{max-width:520px}
  .yours{position:sticky;top:48px;display:flex;flex-direction:column}
  .yours .vframe{display:block;width:100%}
  .yours .vframe .cap{transition:opacity .2s ease}
  .yours .upl{display:block;margin-top:16px}
  .yours .upl-row{flex-direction:column;align-items:stretch;gap:2px}
  .yours .upl-end{order:-1;justify-content:space-between}
  .yours .upl-file{color:var(--text-strong);font-size:15px;font-weight:600}
  .yours .upl-st{font-size:12.5px;color:var(--text-muted)}
  .go{position:static;padding:0;margin-top:18px;background:none}
  .go-note{text-align:left;min-height:0}
}
/* tablets and small laptops: three columns and a narrower preview */
@media (min-width:960px) and (max-width:1239px){
  .p2 main{padding:40px 32px 64px}
  .pick{grid-template-columns:minmax(0,1fr) 240px;gap:32px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .off{max-width:none}
}

/* ================= 3: Projekte ================= */
.plist{list-style:none}
.prow{position:relative;display:flex;align-items:center;gap:14px;padding:12px 0;color:inherit;text-decoration:none;border-radius:16px;
  transition:transform .16s var(--ease-out)}
.plist li + li .prow::before{content:"";position:absolute;top:0;left:68px;right:0;border-top:1px solid var(--border)}
.pthumb{position:relative;width:54px;aspect-ratio:9/16;border-radius:8px;overflow:hidden;flex:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.pthumb .sc{position:absolute;inset:0;background:var(--scene);transition:filter .6s ease,transform .6s var(--ease-out)}
.ptxt{flex:1;min-width:0}
.ptitle{display:block;font-size:16px;font-weight:600;line-height:1.3;color:var(--text-strong);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .4s ease}
.pmeta{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:12.5px;line-height:1.4;color:var(--text-muted);font-variant-numeric:tabular-nums}
.pnote{display:block;margin-top:1px;font-size:12.5px;line-height:1.4;color:var(--text-faint)}
/* job state: analysing amber while Cleo works, ready green when it is done */
.dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--cmd-stopgo);animation:soft-pulse 2s ease-in-out infinite}
.dot.ready{background:var(--cmd-keep);animation:none}
.prow .chev{width:18px;height:18px;color:var(--text-faint);transition:opacity .3s ease}
/* still being edited: the whole row is grey, the frame blurred (owner: no glow) */
.prow.busy{cursor:default}
.prow.arrive{animation:arrive .28s var(--ease-out) backwards}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}}
.prow.busy .pthumb .sc{filter:grayscale(1) blur(5px) brightness(.72);transform:scale(1.2)}
.prow.busy .pthumb::after{content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.07) 50%,transparent 70%);
  transform:translateX(-100%);animation:skel 2.4s ease-in-out infinite}
.prow.busy .ptitle{color:var(--text-muted)}
.prow.busy .chev{opacity:0}
@media (hover:hover) and (pointer:fine){a.prow[href]:hover .ptitle{color:var(--text-strong)}a.prow[href]:hover .chev{color:var(--text-body)}}
a.prow[href]:active{transform:scale(.99)}
@media (min-width:960px){
  .projects{max-width:760px}
  .projects .page-h{margin-bottom:20px}
  .pthumb{width:60px}
  .plist li + li .prow::before{left:74px}
}

/* ================= 4: Vorschau ================= */
/* phones: title, length and buttons share the frame's edges (on short
   phones the column keeps 216px, enough for its longest label) */
.watch{--fh:clamp(260px,calc(100dvh - 344px),620px);display:flex;flex-direction:column;align-items:center;
  width:min(100%,max(calc(var(--fh) * 9 / 16),216px));margin-inline:auto}
.watch .vframe{height:var(--fh);max-width:100%}
.play{position:absolute;z-index:3;left:50%;top:40%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;
  display:grid;place-items:center;color:#fff;background:rgba(11,10,16,.42);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);
  transition:transform .16s var(--ease-out),opacity .2s ease}
.play:active{transform:scale(.94)}
.play .icon{width:26px;height:26px;fill:currentColor;stroke:none;margin-left:3px}
.play .i-pause{display:none;margin-left:0}
.vframe.playing .play{opacity:0}
.vframe.playing:hover .play,.vframe.playing .play:focus-visible{opacity:1}
.vframe.playing .play .i-play{display:none}
.vframe.playing .play .i-pause{display:block}
.scrub{position:absolute;z-index:3;left:12px;right:12px;bottom:12px;height:3px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden;opacity:0;transition:opacity .2s ease}
.scrub i{display:block;height:100%;width:100%;background:#fff;transform-origin:left;transform:scaleX(0)}
.vframe.playing .scrub{opacity:1}
.vframe.playing .scrub i{animation:play var(--len,104s) linear forwards}
@keyframes play{to{transform:scaleX(1)}}
.info{width:100%;margin-top:16px}
.trow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.trow h1{font-size:22px;line-height:1.25;font-weight:800;letter-spacing:-.025em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .len{font-size:15px;font-weight:600;color:var(--text-muted);font-variant-numeric:tabular-nums}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.acts .btn{width:100%}
.act-note{font-size:12.5px;line-height:1.4;color:var(--text-muted);text-align:center;text-wrap:balance}
@media (min-width:960px){
  .watch{--fh:min(680px,calc(100dvh - 120px));flex-direction:row;align-items:flex-end;gap:48px;width:auto;max-width:none;margin-inline:0}
  .watch .vframe{height:var(--fh);width:auto}
  .info{width:320px;margin:0 0 4px}
  .trow{flex-direction:column;align-items:flex-start;gap:4px}
  .trow h1{font-size:40px;line-height:1.1;white-space:normal}
  .trow .len{font-size:16px}
  .acts{margin-top:24px}
  .act-note{text-align:left}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  .prow.busy .pthumb::after,.btn.working::after{display:none}
  .dot{animation:none}
  .vframe.playing .scrub i{animation:none;transform:scaleX(.3)}
}

<script>
(() => {
  const s = document.createElement('div');
  s.style.cssText = 'position:absolute;top:0;left:0;width:1px;height:1px;pointer-events:none';
  document.body.prepend(s);
  new IntersectionObserver(([e]) => document.documentElement.classList.toggle('scrolled', !e.isIntersecting)).observe(s);
})();
</script>
<script>
// Mockup: another project from the list shows its own title, length and frame.
const q = new URLSearchParams(location.search);
const vf = document.getElementById('vf'), len = document.getElementById('len');
if (q.get('t')) {
  document.getElementById('title').textContent = q.get('t');
  len.textContent = q.get('d') || '';
  vf.className = 'vframe scene-' + (q.get('s') || 'a');
  const words = (q.get('c') || '').split(' ').filter(Boolean);
  const cap = document.getElementById('cap');
  cap.textContent = words.slice(0, -1).join(' ') + ' ';
  const hl = document.createElement('span'); hl.className = 'hl'; hl.textContent = words.at(-1) || '';
  cap.appendChild(hl);
}
const [m, s] = len.textContent.split(':').map(Number);
vf.style.setProperty('--len', (m * 60 + s) + 's');
const play = document.getElementById('play');
play.addEventListener('click', () => {
  const on = !vf.classList.contains('playing');
  vf.classList.toggle('playing', on);
  play.setAttribute('aria-label', on ? 'Pause' : 'Abspielen');
});

// "Fertigstellen": the video is rendered first, then saved.
// (Mockup: a few seconds; #fertigstellen and #sichern show each state.)
const fin = document.getElementById('fin'), fine = document.getElementById('fine'), note = document.getElementById('act-note');
const phone = () => matchMedia('(max-width: 959px)').matches;
function working() {
  fin.className = 'btn btn-tint working';
  fin.setAttribute('aria-disabled', 'true');
  fin.textContent = 'Wird fertiggestellt…';
  fine.hidden = true; note.hidden = false;
}
function ready() {
  fin.className = 'btn btn-primary';
  fin.removeAttribute('aria-disabled');
  fin.dataset.ready = '';
  fin.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>' + (phone() ? 'Video sichern' : 'Herunterladen');
  fine.hidden = false; note.hidden = true;
}
fin.addEventListener('click', () => {
  if (fin.getAttribute('aria-disabled') === 'true' || 'ready' in fin.dataset) return;
  working();
  setTimeout(ready, 3500);
});
if (location.hash === '#fertigstellen') working();
else if (location.hash === '#sichern') ready();
</script>
