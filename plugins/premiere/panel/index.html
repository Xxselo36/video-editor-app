<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Video Editor</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #232323;
            color: #e0e0e0;
            margin: 0;
            padding: 16px;
            font-size: 13px;
        }
        h2 {
            margin: 0 0 12px 0;
            font-size: 16px;
            color: #ffffff;
        }
        .group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            color: #aaa;
            font-size: 11px;
            text-transform: uppercase;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 6px 8px;
            background: #1a1a1a;
            border: 1px solid #444;
            color: #e0e0e0;
            border-radius: 4px;
            font-size: 13px;
            box-sizing: border-box;
        }
        select:focus, input:focus {
            border-color: #4a9eff;
            outline: none;
        }
        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-primary {
            background: #4a9eff;
            color: white;
        }
        .btn-primary:hover {
            background: #3a8eef;
        }
        .btn-primary:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #333;
            color: #ccc;
            border: 1px solid #555;
        }
        .status {
            margin-top: 12px;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            display: none;
        }
        .status.info { display: block; background: #1a3a5c; color: #7ab8ff; }
        .status.success { display: block; background: #1a3c1a; color: #7aff7a; }
        .status.error { display: block; background: #3c1a1a; color: #ff7a7a; }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
            display: none;
        }
        .progress-bar.active { display: block; }
        .progress-fill {
            height: 100%;
            background: #4a9eff;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <h2>VIDEO EDITOR</h2>

    <div class="group">
        <label>Style</label>
        <select id="style">
            <option value="clean">clean - Hard Cuts, Clean Subtitles</option>
            <option value="viral">viral - Viral Content Style</option>
            <option value="balanced">balanced - General Purpose</option>
            <option value="cinematic">cinematic - Film Look</option>
            <option value="tiktok">tiktok - TikTok Format</option>
            <option value="minimal">minimal - Minimal Editing</option>
        </select>
    </div>

    <div class="group">
        <label>Whisper Model</label>
        <select id="model">
            <option value="tiny">tiny (fast)</option>
            <option value="base">base</option>
            <option value="small">small</option>
            <option value="medium" selected>medium (recommended)</option>
            <option value="large">large (slow)</option>
        </select>
    </div>

    <button class="btn-primary" id="processBtn" onclick="processVideo()">
        Process Selected Clip
    </button>

    <button class="btn-secondary" onclick="exportXML()">
        Export as Premiere XML
    </button>

    <button class="btn-secondary" onclick="exportEDL()">
        Export as EDL
    </button>

    <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="status" id="status"></div>

    <script>
        const API_URL = 'http://127.0.0.1:8456';
        let lastResult = null;

        async function processVideo() {
            const btn = document.getElementById('processBtn');
            const status = document.getElementById('status');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');

            // Get selected clip path from Premiere
            let videoPath = '';
            try {
                videoPath = await getSelectedClipPath();
            } catch (e) {
                setStatus('error', 'Could not get selected clip. Select a clip in the timeline first.');
                return;
            }

            if (!videoPath) {
                setStatus('error', 'No clip selected. Select a clip in the timeline first.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Processing...';
            progressBar.classList.add('active');
            progressFill.style.width = '30%';
            setStatus('info', 'Analyzing video...');

            try {
                const response = await fetch(`${API_URL}/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        video_path: videoPath,
                        whisper_model: document.getElementById('model').value,
                        style: document.getElementById('style').value,
                    })
                });

                const result = await response.json();
                progressFill.style.width = '80%';

                if (response.ok) {
                    lastResult = result;
                    // Apply to timeline via ExtendScript
                    await applyToTimeline(result);
                    progressFill.style.width = '100%';
                    setStatus('success',
                        `Done! ${result.segments.length} cuts, ${result.subtitles.length} subtitles applied.`);
                } else {
                    setStatus('error', `Error: ${result.error}`);
                }
            } catch (e) {
                setStatus('error',
                    `Cannot connect to Video Editor backend. Make sure it is running on ${API_URL}`);
            }

            btn.disabled = false;
            btn.textContent = 'Process Selected Clip';
            setTimeout(() => {
                progressBar.classList.remove('active');
                progressFill.style.width = '0%';
            }, 2000);
        }

        async function getSelectedClipPath() {
            // Use CSInterface to get selected clip via ExtendScript
            if (typeof CSInterface !== 'undefined') {
                return new Promise((resolve, reject) => {
                    const cs = new CSInterface();
                    cs.evalScript('getSelectedClipPath()', (result) => {
                        if (result && result !== 'undefined' && result !== 'null') {
                            resolve(result);
                        } else {
                            reject(new Error('No clip selected'));
                        }
                    });
                });
            }
            // Fallback: prompt user
            return prompt('Enter video file path:');
        }

        async function applyToTimeline(result) {
            if (typeof CSInterface !== 'undefined') {
                const cs = new CSInterface();
                const data = JSON.stringify(result);
                cs.evalScript(`applyVideoEditorResult('${data.replace(/'/g, "\\'")}')`, () => {});
            }
        }

        async function exportXML() {
            if (!lastResult) {
                setStatus('error', 'Process a video first before exporting.');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/export-xml`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(lastResult)
                });

                const data = await response.json();
                if (data.xml) {
                    // Save XML file
                    downloadText(data.xml, 'video_editor_export.xml');
                    setStatus('success', 'XML exported! Import it into Premiere Pro.');
                }
            } catch (e) {
                setStatus('error', 'Export failed. Is the backend running?');
            }
        }

        async function exportEDL() {
            if (!lastResult) {
                setStatus('error', 'Process a video first before exporting.');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/export-edl`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(lastResult)
                });

                const data = await response.json();
                if (data.edl) {
                    downloadText(data.edl, 'video_editor_export.edl');
                    setStatus('success', 'EDL exported! Import it into Premiere Pro.');
                }
            } catch (e) {
                setStatus('error', 'Export failed. Is the backend running?');
            }
        }

        function downloadText(content, filename) {
            if (typeof CSInterface !== 'undefined') {
                const cs = new CSInterface();
                const path = cs.getSystemPath(SystemPath.USER_DATA) + '/' + filename;
                cs.evalScript(`saveFile('${path}', '${btoa(content)}')`);
                setStatus('success', `Saved to: ${path}`);
            } else {
                const blob = new Blob([content], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                a.click();
            }
        }

        function setStatus(type, message) {
            const el = document.getElementById('status');
            el.className = `status ${type}`;
            el.textContent = message;
        }
    </script>
</body>
</html>
