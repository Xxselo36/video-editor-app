name: e2e setup
description: >-
  Everything the web e2e suites need (.github/workflows/web.yml): Node +
  npm ci in web/, Python + the backend requirements for the stub backend
  (backend/tests/stub_server.py), ffmpeg + espeak-ng for its generated
  media, and the Playwright browsers. Caches pip, npm, the browsers and
  the generated media.

inputs:
  node-version:
    description: Node.js version
    required: true
  python-version:
    description: Python version of the stub backend
    required: true
  browsers:
    description: Playwright browsers to install (chromium, webkit)
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: web/package-lock.json
    - name: npm ci
      shell: bash
      working-directory: web
      run: npm ci

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: |
          backend/requirements.txt
          backend/requirements-dev.txt
    - name: Backend requirements (stub)
      shell: bash
      run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

    - name: ffmpeg + espeak-ng (stub media)
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends ffmpeg espeak-ng
    - name: Cache the stub media
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.stub-media
        key: stub-media-${{ runner.os }}-${{ hashFiles('backend/tests/stub_media.py') }}
    - name: Stub media
      # Built up front on a cache miss (~15 s), not inside a test's timeout.
      shell: bash
      env:
        STUB_MEDIA_DIR: ${{ github.workspace }}/.stub-media
      run: python backend/tests/stub_media.py all

    - name: Playwright version
      id: pw
      shell: bash
      working-directory: web
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Cache the Playwright browsers
      id: pw-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ inputs.browsers }}
    - name: Playwright browsers
      shell: bash
      working-directory: web
      env:
        BROWSERS: ${{ inputs.browsers }}
        CACHED: ${{ steps.pw-cache.outputs.cache-hit }}
      run: |
        # The system libraries always (not cached); the browsers unless cached.
        # shellcheck disable=SC2086
        if [ "$CACHED" = "true" ]; then
          npx playwright install-deps $BROWSERS
        else
          npx playwright install --with-deps $BROWSERS
        fi
