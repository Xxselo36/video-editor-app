name: Cost test (live backend)

# Runs synthetic talking-head videos through the live backend
# (upload → analyze → render) so /admin/costs gets real numbers.
# Costs a few cents per run (Groq, Claude, Modal). Per-job costs are
# printed when the CLEO_ADMIN_TOKEN repo secret is set.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: >-
          profile:minutes pairs, comma-separated. Profiles: synthetic
          (1080p 1 Mbit/s), phone1080 (1080p30 16 Mbit/s), phone4k
          (4K30 45 Mbit/s, rotated), phone4k60 (4K60 60 Mbit/s, rotated)
        required: false
        default: 'phone1080:2,phone1080:10,phone4k:3'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg + espeak-ng
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Run
        env:
          CLEO_ADMIN_TOKEN: ${{ secrets.CLEO_ADMIN_TOKEN }}
          RUNS: ${{ inputs.runs }}
        run: python .github/scripts/cost_test.py "$RUNS"
