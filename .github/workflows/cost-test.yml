name: Cost test (live backend)

# Runs synthetic talking-head videos through the live backend
# (upload → analyze → render) so /admin/costs gets real numbers.
# Costs a few cents per run (Groq, Claude, Modal). Per-job costs are
# printed when the CLEO_ADMIN_TOKEN repo secret is set.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: >-
          profile:minutes[:preset], comma-separated. Profiles: synthetic,
          phone1080, phone4k, iphone1080hdr, iphone4khdr. Presets: tiktok
          (default), podcast, vlog, captions. See .github/scripts/cost_test.py
        required: false
        default: 'phone1080:2,phone1080:10,phone4k:3,iphone4khdr:3'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg + espeak-ng
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Run
        env:
          CLEO_ADMIN_TOKEN: ${{ secrets.CLEO_ADMIN_TOKEN }}
          RUNS: ${{ inputs.runs }}
        run: python .github/scripts/cost_test.py "$RUNS"
