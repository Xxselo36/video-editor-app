name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - linux

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ============================================================================
  # Windows Build
  # ============================================================================
  build-windows:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r build-requirements.txt

      - name: Prepare ffprobe
        shell: bash
        run: |
          mkdir -p bin
          python -c "
          import shutil, os
          p = shutil.which('ffprobe')
          if p:
              print(p)
          else:
              try:
                  import imageio_ffmpeg
                  ff = imageio_ffmpeg.get_ffmpeg_exe()
                  d = os.path.dirname(ff)
                  fp = os.path.join(d, 'ffprobe.exe')
                  if os.path.isfile(fp):
                      print(fp)
              except:
                  pass
          " > ffprobe_path.txt
          FFPROBE=$(cat ffprobe_path.txt)
          if [ -n "$FFPROBE" ] && [ -f "$FFPROBE" ]; then
            cp "$FFPROBE" bin/ffprobe.exe
          else
            echo "Downloading ffprobe..."
            curl -L -o ffprobe.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
            unzip -j ffprobe.zip '*/bin/ffprobe.exe' -d bin/ || true
          fi

      - name: Cache Nuitka ccache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka
          key: nuitka-windows-${{ hashFiles('gui.py', 'src/*.py') }}
          restore-keys: nuitka-windows-

      - name: Build with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --no-deployment-flag=excluded-module-usage `
            --windows-console-mode=disable `
            --windows-icon-from-ico=icon.ico `
            --enable-plugin=tk-inter `
            --include-package=customtkinter `
            --include-package=whisper `
            --include-package=moviepy `
            --include-package=cv2 `
            --include-package=scipy `
            --include-package=imageio_ffmpeg `
            --include-package=src `
            --include-package-data=whisper `
            --include-data-files=yolov8n.pt=yolov8n.pt `
            --include-data-files=logo.png=logo.png `
            --include-data-files=bin/ffprobe.exe=ffprobe.exe `
            --include-data-dir=src=src `
            --nofollow-import-to=diffusers `
            --nofollow-import-to=accelerate `
            --nofollow-import-to=transformers `
            --nofollow-import-to=matplotlib `
            --nofollow-import-to=pytest `
            --nofollow-import-to=IPython `
            --nofollow-import-to=notebook `
            --nofollow-import-to=jupyter `
            --nofollow-import-to=torch `
            --nofollow-import-to=sympy `
            --nofollow-import-to=scipy.integrate._lebedev `
            --output-dir=dist `
            gui.py

      - name: Copy torch into build (hybrid approach)
        shell: bash
        run: |
          DIST_DIR="dist/gui.dist"
          TORCH_SRC=$(python -c "import torch; import os; print(os.path.dirname(torch.__file__))")
          echo "Copying torch from $TORCH_SRC..."
          cp -R "$TORCH_SRC" "$DIST_DIR/torch"

          # Copy torchgen if present
          TORCHGEN_SRC=$(python -c "
          try:
              import torchgen, os
              print(os.path.dirname(torchgen.__file__))
          except: pass
          " 2>/dev/null)
          if [ -n "$TORCHGEN_SRC" ] && [ -d "$TORCHGEN_SRC" ]; then
            cp -R "$TORCHGEN_SRC" "$DIST_DIR/torchgen"
          fi

          # Cleanup unnecessary files
          rm -rf "$DIST_DIR/torch/include" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/distributed" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/share" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/csrc" 2>/dev/null || true
          find "$DIST_DIR/torch" -name "*.pyi" -delete 2>/dev/null || true
          find "$DIST_DIR/torch" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true

          # Remove CUDA libraries (CPU-only)
          find "$DIST_DIR/torch" -name "cudart*" -delete 2>/dev/null || true
          find "$DIST_DIR/torch" -name "cublas*" -delete 2>/dev/null || true
          find "$DIST_DIR/torch" -name "cufft*" -delete 2>/dev/null || true
          find "$DIST_DIR/torch" -name "curand*" -delete 2>/dev/null || true
          find "$DIST_DIR/torch" -name "cusparse*" -delete 2>/dev/null || true
          find "$DIST_DIR/torch" -name "cusolver*" -delete 2>/dev/null || true
          find "$DIST_DIR/torch" -name "nvrtc*" -delete 2>/dev/null || true
          find "$DIST_DIR/torch" -name "nvJitLink*" -delete 2>/dev/null || true
          find "$DIST_DIR/torch" -name "cudnn*" -delete 2>/dev/null || true

          echo "torch size after cleanup:"
          du -sh "$DIST_DIR/torch"

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create NSIS Installer
        run: makensis installer.nsi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-Windows
          path: VideoEditor-Setup.exe

  # ============================================================================
  # Linux Build
  # ============================================================================
  build-linux:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'linux'
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-tk \
            ffmpeg \
            libfuse2 \
            patchelf \
            libgirepository1.0-dev

      - name: Install Python dependencies (CPU-only torch)
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r build-requirements.txt

      - name: Cache Nuitka ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-linux-v2-${{ hashFiles('gui.py', 'src/*.py') }}
          restore-keys: nuitka-linux-v2-

      - name: Add swap space
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --assume-yes-for-downloads \
            --no-deployment-flag=excluded-module-usage \
            --jobs=1 \
            --enable-plugin=tk-inter \
            --include-package=customtkinter \
            --include-package=whisper \
            --include-package=moviepy \
            --include-package=cv2 \
            --include-package=scipy \
            --include-package=imageio_ffmpeg \
            --include-package=src \
            --include-package-data=whisper \
            --include-data-files=yolov8n.pt=yolov8n.pt \
            --include-data-files=logo.png=logo.png \
            --include-data-dir=src=src \
            --nofollow-import-to=diffusers \
            --nofollow-import-to=accelerate \
            --nofollow-import-to=transformers \
            --nofollow-import-to=matplotlib \
            --nofollow-import-to=pytest \
            --nofollow-import-to=IPython \
            --nofollow-import-to=notebook \
            --nofollow-import-to=jupyter \
            --nofollow-import-to=torch \
            --nofollow-import-to=sympy \
            --nofollow-import-to=scipy.integrate._lebedev \
            --output-dir=dist \
            gui.py

      - name: Copy torch into build (hybrid approach)
        run: |
          DIST_DIR="dist/gui.dist"
          TORCH_SRC=$(python -c "import torch; import os; print(os.path.dirname(torch.__file__))")
          echo "Copying torch from $TORCH_SRC..."
          cp -R "$TORCH_SRC" "$DIST_DIR/torch"

          # Copy torchgen if present
          TORCHGEN_SRC=$(python -c "
          try:
              import torchgen, os
              print(os.path.dirname(torchgen.__file__))
          except: pass
          " 2>/dev/null) || true
          if [ -n "$TORCHGEN_SRC" ] && [ -d "$TORCHGEN_SRC" ]; then
            cp -R "$TORCHGEN_SRC" "$DIST_DIR/torchgen"
          fi

          # Cleanup unnecessary torch files
          rm -rf "$DIST_DIR/torch/include" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/distributed" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/share" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/csrc" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/testing" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/_dynamo" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/_inductor" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/_export" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/_functorch" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/onnx" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/optim" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/profiler" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/ao" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/compiler" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/fx" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/package" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/cuda" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/backends/cudnn" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/backends/cuda" 2>/dev/null || true
          find "$DIST_DIR/torch" -name "*.pyi" -delete 2>/dev/null || true
          find "$DIST_DIR/torch" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true

          # Remove ALL CUDA/NVIDIA libraries from entire dist (CPU-only)
          find "$DIST_DIR" -name "libcudart*" -delete 2>/dev/null || true
          find "$DIST_DIR" -name "libcublas*" -delete 2>/dev/null || true
          find "$DIST_DIR" -name "libcufft*" -delete 2>/dev/null || true
          find "$DIST_DIR" -name "libcurand*" -delete 2>/dev/null || true
          find "$DIST_DIR" -name "libcusparse*" -delete 2>/dev/null || true
          find "$DIST_DIR" -name "libcusolver*" -delete 2>/dev/null || true
          find "$DIST_DIR" -name "libnvrtc*" -delete 2>/dev/null || true
          find "$DIST_DIR" -name "libnvJitLink*" -delete 2>/dev/null || true
          find "$DIST_DIR" -name "libcudnn*" -delete 2>/dev/null || true
          find "$DIST_DIR" -name "libnvidia*" -delete 2>/dev/null || true
          find "$DIST_DIR" -name "libnvToolsExt*" -delete 2>/dev/null || true
          find "$DIST_DIR" -path "*/nvidia/*" -name "*.so*" -delete 2>/dev/null || true
          find "$DIST_DIR" -name "*_cuda*" -name "*.so" -delete 2>/dev/null || true
          rm -rf "$DIST_DIR/nvidia" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/lib/libcaffe2_nvrtc.so" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/lib/libc10_cuda.so" 2>/dev/null || true
          rm -rf "$DIST_DIR/torch/lib/libtorch_cuda*.so" 2>/dev/null || true

          # Strip debug symbols from everything
          find "$DIST_DIR" -name "*.so" -exec strip --strip-debug {} \; 2>/dev/null || true
          find "$DIST_DIR" -name "*.so.*" -exec strip --strip-debug {} \; 2>/dev/null || true

          echo "torch size after cleanup:"
          du -sh "$DIST_DIR/torch"
          echo "total dist size:"
          du -sh "$DIST_DIR"

      - name: Package Linux build as AppImage
        run: |
          DIST_DIR="dist/gui.dist"

          # Remove build artifacts
          rm -rf dist/gui.build

          # Rename binary
          if [ -f "$DIST_DIR/gui.bin" ]; then
            mv "$DIST_DIR/gui.bin" "$DIST_DIR/SmartCut"
          fi
          chmod +x "$DIST_DIR/SmartCut"

          echo "Final dist size:"
          du -sh "$DIST_DIR"

          # --- Build AppImage ---
          APPDIR="dist/SmartCut.AppDir"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # Move all dist contents into AppDir
          cp -R "$DIST_DIR"/* "$APPDIR/usr/bin/"

          # Create .desktop file
          cat > "$APPDIR/SmartCut.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=SmartCut
          Exec=SmartCut
          Icon=smartcut
          Categories=AudioVideo;Video;
          Comment=AI-powered video editing
          DESKTOP
          # Fix indentation
          sed -i 's/^          //' "$APPDIR/SmartCut.desktop"

          # Create a simple icon (use logo.png if available, otherwise generate one)
          if [ -f "logo.png" ]; then
            cp logo.png "$APPDIR/smartcut.png"
            cp logo.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/smartcut.png"
          else
            # Generate a minimal 1x1 PNG as fallback
            python -c "
          from PIL import Image
          img = Image.new('RGBA', (256, 256), (108, 92, 231, 255))
          img.save('$APPDIR/smartcut.png')
          " || true
            cp "$APPDIR/smartcut.png" "$APPDIR/usr/share/icons/hicolor/256x256/apps/smartcut.png" 2>/dev/null || true
          fi

          # Create AppRun script
          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/SmartCut" "$@"
          APPRUN
          sed -i 's/^          //' "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          # Download appimagetool
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

          # Build AppImage
          ARCH=x86_64 ./appimagetool --no-appstream "$APPDIR" SmartCut-Linux.AppImage || {
            # Fallback: try with --appimage-extract-and-run for environments without FUSE
            ARCH=x86_64 ./appimagetool --appimage-extract-and-run --no-appstream "$APPDIR" SmartCut-Linux.AppImage
          }

          ls -lh SmartCut-Linux.AppImage

          # Also keep tar.xz as fallback
          mv "$DIST_DIR" dist/SmartCut-Linux 2>/dev/null || true
          tar cf - -C dist SmartCut-Linux | xz -6 -T0 > SmartCut-Linux.tar.xz 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCut-Linux
          path: |
            SmartCut-Linux.AppImage
            SmartCut-Linux.tar.xz

      - name: Upload to Release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.0 SmartCut-Linux.AppImage --repo ${{ github.repository }} --clobber || echo "AppImage upload skipped"
          gh release upload v1.0.0 SmartCut-Linux.tar.xz --repo ${{ github.repository }} --clobber || echo "tar.xz upload skipped"

  # ============================================================================
  # Release
  # ============================================================================
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
          files: |
            artifacts/VideoEditor-Windows/VideoEditor-Setup.exe
            artifacts/VideoEditor-Linux/VideoEditor-Linux.tar.xz
          overwrite_files: true
