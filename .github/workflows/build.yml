name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - windows
          - linux

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ============================================================================
  # macOS Build (Apple Silicon)
  # ============================================================================
  build-macos:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'macos'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r build-requirements.txt

      - name: Prepare ffprobe
        run: |
          mkdir -p bin
          FFPROBE_PATH=$(python3 -c "
          import shutil
          p = shutil.which('ffprobe')
          if p: print(p)
          else:
              try:
                  import imageio_ffmpeg
                  ff = imageio_ffmpeg.get_ffmpeg_exe()
                  import os
                  d = os.path.dirname(ff)
                  fp = os.path.join(d, 'ffprobe')
                  if os.path.isfile(fp): print(fp)
              except: pass
          ")
          if [ -n "$FFPROBE_PATH" ]; then
            cp "$FFPROBE_PATH" bin/ffprobe
            chmod +x bin/ffprobe
          else
            echo "Warning: ffprobe not found, downloading..."
            brew install ffmpeg
            cp $(which ffprobe) bin/ffprobe
          fi

      - name: Cache Nuitka ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-macos-${{ hashFiles('gui.py', 'src/*.py') }}
          restore-keys: nuitka-macos-

      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --assume-yes-for-downloads \
            --no-deployment-flag=excluded-module-usage \
            --macos-create-app-bundle \
            --macos-app-name="VideoEditor" \
            --macos-signed-app-name="com.videoeditor.app" \
            --enable-plugin=tk-inter \
            --include-package=customtkinter \
            --include-package=whisper \
            --include-package=torch \
            --include-package=torch.nn \
            --include-package=moviepy \
            --include-package=cv2 \
            --include-package=scipy \
            --include-package=imageio_ffmpeg \
            --include-package=src \
            --include-data-files=yolov8n.pt=yolov8n.pt \
            --include-data-files=bin/ffprobe=ffprobe \
            --include-data-dir=src=src \
            --nofollow-import-to=diffusers \
            --nofollow-import-to=accelerate \
            --nofollow-import-to=transformers \
            --nofollow-import-to=matplotlib \
            --nofollow-import-to=pytest \
            --nofollow-import-to=IPython \
            --nofollow-import-to=notebook \
            --nofollow-import-to=jupyter \
            --nofollow-import-to=torch._dynamo \
            --nofollow-import-to=torch._inductor \
            --nofollow-import-to=torch.testing \
            --nofollow-import-to=torch.utils.benchmark \
            --nofollow-import-to=torch.distributed \
            --nofollow-import-to=sympy \
            --nofollow-import-to=scipy.integrate._lebedev \
            --output-dir=dist \
            gui.py

          mv dist/gui.app dist/VideoEditor.app

      - name: Import Signing Certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          rm certificate.p12

      - name: Code Sign
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          APP_PATH="dist/VideoEditor.app"

          # Alle .so und .dylib signieren
          find "$APP_PATH" -type f \( -name "*.so" -o -name "*.dylib" \) | while read lib; do
            codesign --force --timestamp --options runtime \
              --entitlements entitlements.plist \
              --sign "$SIGNING_IDENTITY" "$lib" 2>/dev/null || true
          done

          # Ausfuehrbare Dateien signieren
          find "$APP_PATH/Contents/MacOS" -type f -perm +111 | while read bin; do
            codesign --force --timestamp --options runtime \
              --entitlements entitlements.plist \
              --sign "$SIGNING_IDENTITY" "$bin" 2>/dev/null || true
          done

          # ffprobe signieren
          if [ -f "$APP_PATH/Contents/MacOS/ffprobe" ]; then
            codesign --force --timestamp --options runtime \
              --entitlements entitlements.plist \
              --sign "$SIGNING_IDENTITY" "$APP_PATH/Contents/MacOS/ffprobe"
          fi

          # .app Bundle signieren (mit Retry fuer Timestamp-Server)
          for i in 1 2 3 4 5; do
            echo "Signing attempt $i..."
            codesign --force --deep --timestamp --options runtime \
              --entitlements entitlements.plist \
              --sign "$SIGNING_IDENTITY" "$APP_PATH" && break
            echo "Attempt $i failed, waiting 30s..."
            sleep 30
          done

          codesign --verify --verbose "$APP_PATH"

      - name: Create PKG
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          pkgbuild --root dist/VideoEditor.app \
            --identifier com.videoeditor.app \
            --version 1.0.0 \
            --install-location /Applications/VideoEditor.app \
            --sign "$SIGNING_IDENTITY" \
            dist/VideoEditor.pkg

      - name: Notarize PKG
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          xcrun notarytool submit dist/VideoEditor.pkg \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --wait

          xcrun stapler staple dist/VideoEditor.pkg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-macOS
          path: dist/VideoEditor.pkg

  # ============================================================================
  # Windows Build
  # ============================================================================
  build-windows:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r build-requirements.txt

      - name: Prepare ffprobe
        shell: bash
        run: |
          mkdir -p bin
          python -c "
          import shutil, os
          p = shutil.which('ffprobe')
          if p:
              print(p)
          else:
              try:
                  import imageio_ffmpeg
                  ff = imageio_ffmpeg.get_ffmpeg_exe()
                  d = os.path.dirname(ff)
                  fp = os.path.join(d, 'ffprobe.exe')
                  if os.path.isfile(fp):
                      print(fp)
              except:
                  pass
          " > ffprobe_path.txt
          FFPROBE=$(cat ffprobe_path.txt)
          if [ -n "$FFPROBE" ] && [ -f "$FFPROBE" ]; then
            cp "$FFPROBE" bin/ffprobe.exe
          else
            echo "Downloading ffprobe..."
            curl -L -o ffprobe.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
            unzip -j ffprobe.zip '*/bin/ffprobe.exe' -d bin/ || true
          fi

      - name: Cache Nuitka ccache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka
          key: nuitka-windows-${{ hashFiles('gui.py', 'src/*.py') }}
          restore-keys: nuitka-windows-

      - name: Build with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --no-deployment-flag=excluded-module-usage `
            --windows-console-mode=disable `
            --enable-plugin=tk-inter `
            --include-package=customtkinter `
            --include-package=whisper `
            --include-package=torch `
            --include-package=torch.nn `
            --include-package=moviepy `
            --include-package=cv2 `
            --include-package=scipy `
            --include-package=imageio_ffmpeg `
            --include-package=src `
            --include-data-files=yolov8n.pt=yolov8n.pt `
            --include-data-files=bin/ffprobe.exe=ffprobe.exe `
            --include-data-dir=src=src `
            --nofollow-import-to=diffusers `
            --nofollow-import-to=accelerate `
            --nofollow-import-to=transformers `
            --nofollow-import-to=matplotlib `
            --nofollow-import-to=pytest `
            --nofollow-import-to=IPython `
            --nofollow-import-to=notebook `
            --nofollow-import-to=jupyter `
            --nofollow-import-to=torch._dynamo `
            --nofollow-import-to=torch._inductor `
            --nofollow-import-to=torch.testing `
            --nofollow-import-to=torch.utils.benchmark `
            --nofollow-import-to=torch.distributed `
            --nofollow-import-to=sympy `
            --nofollow-import-to=scipy.integrate._lebedev `
            --output-dir=dist `
            gui.py

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create NSIS Installer
        run: makensis installer.nsi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-Windows
          path: VideoEditor-Setup.exe

  # ============================================================================
  # Linux Build
  # ============================================================================
  build-linux:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'linux'
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "After cleanup:"
          df -h /

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-tk \
            ffmpeg \
            libfuse2 \
            patchelf \
            libgirepository1.0-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r build-requirements.txt

      - name: Cache Nuitka ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-linux-${{ hashFiles('gui.py', 'src/*.py') }}
          restore-keys: nuitka-linux-

      - name: Add swap space
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Swap enabled: $(swapon --show)"

      - name: Build with Nuitka
        run: |
          echo "=== Starting Nuitka build at $(date) ==="
          echo "Memory: $(free -h)"
          python -m nuitka \
            --standalone \
            --assume-yes-for-downloads \
            --no-deployment-flag=excluded-module-usage \
            --jobs=1 \
            --enable-plugin=tk-inter \
            --include-package=customtkinter \
            --include-package=whisper \
            --include-package=torch.nn \
            --include-package=moviepy \
            --include-package=cv2 \
            --include-package=imageio_ffmpeg \
            --include-package=src \
            --include-data-files=yolov8n.pt=yolov8n.pt \
            --include-data-dir=src=src \
            --nofollow-import-to=diffusers \
            --nofollow-import-to=accelerate \
            --nofollow-import-to=transformers \
            --nofollow-import-to=matplotlib \
            --nofollow-import-to=pytest \
            --nofollow-import-to=IPython \
            --nofollow-import-to=notebook \
            --nofollow-import-to=jupyter \
            --nofollow-import-to=torch._dynamo \
            --nofollow-import-to=torch._inductor \
            --nofollow-import-to=torch.testing \
            --nofollow-import-to=torch.utils.benchmark \
            --nofollow-import-to=torch.distributed \
            --nofollow-import-to=torch.cuda \
            --nofollow-import-to=torch.backends.cudnn \
            --nofollow-import-to=torch.backends.cuda \
            --nofollow-import-to=torch.onnx \
            --nofollow-import-to=torch.optim \
            --nofollow-import-to=torch.profiler \
            --nofollow-import-to=sympy \
            --nofollow-import-to=scipy.integrate._lebedev \
            --output-dir=dist \
            gui.py
          echo "=== Nuitka build finished at $(date) ==="

      - name: Package Linux build
        run: |
          echo "Disk space:"
          df -h /

          # Remove build artifacts to save space
          rm -rf dist/gui.build

          # Strip debug symbols from all .so files to reduce size
          find dist/gui.dist -name "*.so" -exec strip --strip-debug {} \; 2>/dev/null || true
          find dist/gui.dist -name "*.so.*" -exec strip --strip-debug {} \; 2>/dev/null || true

          # Remove CUDA/NVIDIA libraries (not needed for CPU-only)
          find dist/gui.dist -name "libcudart*" -delete 2>/dev/null || true
          find dist/gui.dist -name "libcublas*" -delete 2>/dev/null || true
          find dist/gui.dist -name "libcufft*" -delete 2>/dev/null || true
          find dist/gui.dist -name "libcurand*" -delete 2>/dev/null || true
          find dist/gui.dist -name "libcusparse*" -delete 2>/dev/null || true
          find dist/gui.dist -name "libcusolver*" -delete 2>/dev/null || true
          find dist/gui.dist -name "libnvrtc*" -delete 2>/dev/null || true
          find dist/gui.dist -name "libnvJitLink*" -delete 2>/dev/null || true
          find dist/gui.dist -name "libcudnn*" -delete 2>/dev/null || true
          find dist/gui.dist -name "libnvToolsExt*" -delete 2>/dev/null || true
          find dist/gui.dist -name "libnvidia*" -delete 2>/dev/null || true
          # Remove nvidia pip package .so files
          find dist/gui.dist -path "*/nvidia/*" -name "*.so*" -delete 2>/dev/null || true
          # Remove torch CUDA-specific .so files
          find dist/gui.dist -name "*_cuda*" -name "*.so" -delete 2>/dev/null || true

          echo "Size after cleanup:"
          du -sh dist/gui.dist

          # Rename binary
          if [ -f dist/gui.dist/gui.bin ]; then
            mv dist/gui.dist/gui.bin dist/gui.dist/VideoEditor
          fi
          chmod +x dist/gui.dist/VideoEditor

          # Rename directory and create compressed archive
          mv dist/gui.dist dist/VideoEditor-Linux
          tar cf - -C dist VideoEditor-Linux | xz -3 -T0 > VideoEditor-Linux.tar.xz

          ls -lh VideoEditor-Linux.tar.xz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-Linux
          path: VideoEditor-Linux.tar.xz

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.ref_name }} VideoEditor-Linux.tar.xz --repo ${{ github.repository }} --clobber

  # ============================================================================
  # Release
  # ============================================================================
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref, '-test') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
          files: |
            artifacts/VideoEditor-Windows/VideoEditor-Setup.exe
            artifacts/VideoEditor-macOS/VideoEditor.pkg
          overwrite_files: true
