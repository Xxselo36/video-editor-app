name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - windows
          - linux

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ============================================================================
  # macOS Build (Apple Silicon)
  # ============================================================================
  build-macos:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'macos'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r build-requirements.txt

      - name: Prepare ffprobe
        run: |
          mkdir -p bin
          FFPROBE_PATH=$(python3 -c "
          import shutil
          p = shutil.which('ffprobe')
          if p: print(p)
          else:
              try:
                  import imageio_ffmpeg
                  ff = imageio_ffmpeg.get_ffmpeg_exe()
                  import os
                  d = os.path.dirname(ff)
                  fp = os.path.join(d, 'ffprobe')
                  if os.path.isfile(fp): print(fp)
              except: pass
          ")
          if [ -n "$FFPROBE_PATH" ]; then
            cp "$FFPROBE_PATH" bin/ffprobe
            chmod +x bin/ffprobe
          else
            echo "Warning: ffprobe not found, downloading..."
            brew install ffmpeg
            cp $(which ffprobe) bin/ffprobe
          fi

      - name: Cache Nuitka ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-macos-${{ hashFiles('gui.py', 'src/*.py') }}
          restore-keys: nuitka-macos-

      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --assume-yes-for-downloads \
            --macos-create-app-bundle \
            --macos-app-name="VideoEditor" \
            --macos-signed-app-name="com.videoeditor.app" \
            --enable-plugin=tk-inter \
            --include-package=customtkinter \
            --include-package=whisper \
            --include-package=torch \
            --include-package=moviepy \
            --include-package=cv2 \
            --include-package=scipy \
            --include-package=imageio_ffmpeg \
            --include-package=src \
            --include-data-files=yolov8n.pt=yolov8n.pt \
            --include-data-files=bin/ffprobe=ffprobe \
            --include-data-dir=src=src \
            --nofollow-import-to=diffusers \
            --nofollow-import-to=accelerate \
            --nofollow-import-to=transformers \
            --nofollow-import-to=matplotlib \
            --nofollow-import-to=pytest \
            --nofollow-import-to=IPython \
            --nofollow-import-to=notebook \
            --nofollow-import-to=jupyter \
            --nofollow-import-to=torch._dynamo \
            --nofollow-import-to=torch._inductor \
            --nofollow-import-to=torch._functorch \
            --nofollow-import-to=torch.distributed \
            --nofollow-import-to=torch.testing \
            --nofollow-import-to=torch.utils.benchmark \
            --nofollow-import-to=sympy \
            --nofollow-import-to=torch.utils._config_module \
            --nofollow-import-to=scipy.integrate._lebedev \
            --output-dir=dist \
            gui.py

          # Umbenennen
          mv dist/gui.app dist/VideoEditor.app

      - name: Import Signing Certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          rm certificate.p12

      - name: Code Sign
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          APP_PATH="dist/VideoEditor.app"

          # Alle .so und .dylib signieren
          find "$APP_PATH" -type f \( -name "*.so" -o -name "*.dylib" \) | while read lib; do
            codesign --force --timestamp --options runtime \
              --entitlements entitlements.plist \
              --sign "$SIGNING_IDENTITY" "$lib" 2>/dev/null || true
          done

          # Ausfuehrbare Dateien signieren
          find "$APP_PATH/Contents/MacOS" -type f -perm +111 | while read bin; do
            codesign --force --timestamp --options runtime \
              --entitlements entitlements.plist \
              --sign "$SIGNING_IDENTITY" "$bin" 2>/dev/null || true
          done

          # ffprobe signieren
          if [ -f "$APP_PATH/Contents/MacOS/ffprobe" ]; then
            codesign --force --timestamp --options runtime \
              --entitlements entitlements.plist \
              --sign "$SIGNING_IDENTITY" "$APP_PATH/Contents/MacOS/ffprobe"
          fi

          # .app Bundle signieren
          codesign --force --deep --timestamp --options runtime \
            --entitlements entitlements.plist \
            --sign "$SIGNING_IDENTITY" "$APP_PATH"

          codesign --verify --verbose "$APP_PATH"

      - name: Create PKG
        env:
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: |
          # PKG aus der signierten .app erstellen
          # --compress none: verhindert stundenlanges Komprimieren der ~2GB App
          pkgbuild \
            --component dist/VideoEditor.app \
            --install-location /Applications \
            --identifier com.videoeditor.app \
            --version 1.0.0 \
            --sign "$INSTALLER_IDENTITY" \
            dist/VideoEditor.pkg

      - name: Create DMG
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          DMG_TEMP="dist/dmg_temp"
          mkdir -p "$DMG_TEMP"
          cp -R dist/VideoEditor.app "$DMG_TEMP/"
          ln -s /Applications "$DMG_TEMP/Applications"

          hdiutil create -volname "VideoEditor" \
            -srcfolder "$DMG_TEMP" \
            -ov -format UDZO \
            dist/VideoEditor.dmg

          rm -rf "$DMG_TEMP"

          codesign --force --timestamp \
            --sign "$SIGNING_IDENTITY" \
            dist/VideoEditor.dmg

      - name: Notarize PKG
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          xcrun notarytool submit dist/VideoEditor.pkg \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --wait

          xcrun stapler staple dist/VideoEditor.pkg

      - name: Notarize DMG
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          xcrun notarytool submit dist/VideoEditor.dmg \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --wait

          xcrun stapler staple dist/VideoEditor.dmg

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-macOS
          path: |
            dist/VideoEditor.pkg
            dist/VideoEditor.dmg

  # ============================================================================
  # Windows Build
  # ============================================================================
  build-windows:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r build-requirements.txt

      - name: Prepare ffprobe
        shell: bash
        run: |
          mkdir -p bin
          python -c "
          import shutil, os
          p = shutil.which('ffprobe')
          if p:
              print(p)
          else:
              try:
                  import imageio_ffmpeg
                  ff = imageio_ffmpeg.get_ffmpeg_exe()
                  d = os.path.dirname(ff)
                  fp = os.path.join(d, 'ffprobe.exe')
                  if os.path.isfile(fp):
                      print(fp)
              except:
                  pass
          " > ffprobe_path.txt
          FFPROBE=$(cat ffprobe_path.txt)
          if [ -n "$FFPROBE" ] && [ -f "$FFPROBE" ]; then
            cp "$FFPROBE" bin/ffprobe.exe
          else
            echo "Downloading ffprobe..."
            curl -L -o ffprobe.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
            unzip -j ffprobe.zip '*/bin/ffprobe.exe' -d bin/ || true
          fi

      - name: Cache Nuitka ccache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka
          key: nuitka-windows-${{ hashFiles('gui.py', 'src/*.py') }}
          restore-keys: nuitka-windows-

      - name: Build with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --enable-plugin=tk-inter `
            --include-package=customtkinter `
            --include-package=whisper `
            --include-package=torch `
            --include-package=moviepy `
            --include-package=cv2 `
            --include-package=scipy `
            --include-package=imageio_ffmpeg `
            --include-package=src `
            --include-data-files=yolov8n.pt=yolov8n.pt `
            --include-data-files=bin/ffprobe.exe=ffprobe.exe `
            --include-data-dir=src=src `
            --nofollow-import-to=diffusers `
            --nofollow-import-to=accelerate `
            --nofollow-import-to=transformers `
            --nofollow-import-to=matplotlib `
            --nofollow-import-to=pytest `
            --nofollow-import-to=IPython `
            --nofollow-import-to=notebook `
            --nofollow-import-to=jupyter `
            --nofollow-import-to=torch._dynamo `
            --nofollow-import-to=torch._inductor `
            --nofollow-import-to=torch._functorch `
            --nofollow-import-to=torch.distributed `
            --nofollow-import-to=torch.testing `
            --nofollow-import-to=torch.utils.benchmark `
            --nofollow-import-to=sympy `
            --nofollow-import-to=torch.utils._config_module `
            --nofollow-import-to=scipy.integrate._lebedev `
            --output-dir=dist `
            gui.py

      - name: Create NSIS Installer
        uses: joncloud/makensis-action@v4
        with:
          script-file: installer.nsi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-Windows
          path: VideoEditor-Setup.exe

  # ============================================================================
  # Linux Build
  # ============================================================================
  build-linux:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-tk \
            ffmpeg \
            libfuse2 \
            patchelf \
            libgirepository1.0-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r build-requirements.txt

      - name: Cache Nuitka ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-linux-${{ hashFiles('gui.py', 'src/*.py') }}
          restore-keys: nuitka-linux-

      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --assume-yes-for-downloads \
            --enable-plugin=tk-inter \
            --include-package=customtkinter \
            --include-package=whisper \
            --include-package=torch \
            --include-package=moviepy \
            --include-package=cv2 \
            --include-package=scipy \
            --include-package=imageio_ffmpeg \
            --include-package=src \
            --include-data-files=yolov8n.pt=yolov8n.pt \
            --include-data-dir=src=src \
            --nofollow-import-to=diffusers \
            --nofollow-import-to=accelerate \
            --nofollow-import-to=transformers \
            --nofollow-import-to=matplotlib \
            --nofollow-import-to=pytest \
            --nofollow-import-to=IPython \
            --nofollow-import-to=notebook \
            --nofollow-import-to=jupyter \
            --nofollow-import-to=torch._dynamo \
            --nofollow-import-to=torch._inductor \
            --nofollow-import-to=torch._functorch \
            --nofollow-import-to=torch.distributed \
            --nofollow-import-to=torch.testing \
            --nofollow-import-to=torch.utils.benchmark \
            --nofollow-import-to=sympy \
            --nofollow-import-to=torch.utils._config_module \
            --nofollow-import-to=scipy.integrate._lebedev \
            --output-dir=dist \
            gui.py

      - name: Create AppImage
        run: |
          # linuxdeploy herunterladen
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          # AppDir Struktur erstellen
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Nuitka Output kopieren
          cp -r dist/gui.dist/* AppDir/usr/bin/

          # Desktop-Datei erstellen
          cat > AppDir/usr/share/applications/videoeditor.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=Video Editor
          Exec=gui
          Icon=videoeditor
          Type=Application
          Categories=AudioVideo;Video;
          DESKTOP

          cp AppDir/usr/share/applications/videoeditor.desktop AppDir/

          # Platzhalter-Icon (wird durch echtes Icon ersetzt wenn vorhanden)
          if [ -f icon.png ]; then
            cp icon.png AppDir/usr/share/icons/hicolor/256x256/apps/videoeditor.png
            cp icon.png AppDir/videoeditor.png
          else
            # Einfaches Platzhalter-Icon generieren
            python3 -c "
          from PIL import Image
          img = Image.new('RGBA', (256, 256), (41, 128, 185, 255))
          img.save('AppDir/videoeditor.png')
          img.save('AppDir/usr/share/icons/hicolor/256x256/apps/videoeditor.png')
          "
          fi

          # AppImage erstellen
          ARCH=x86_64 ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/videoeditor.desktop \
            --output appimage

          mv VideoEditor*.AppImage VideoEditor-x86_64.AppImage || \
          mv Video_Editor*.AppImage VideoEditor-x86_64.AppImage || \
          mv *.AppImage VideoEditor-x86_64.AppImage || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-Linux
          path: VideoEditor-x86_64.AppImage

  # ============================================================================
  # Release
  # ============================================================================
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref, '-test') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
          files: |
            artifacts/VideoEditor-macOS/VideoEditor.pkg
            artifacts/VideoEditor-macOS/VideoEditor.dmg
            artifacts/VideoEditor-Windows/VideoEditor-Setup.exe
            artifacts/VideoEditor-Linux/VideoEditor-x86_64.AppImage
