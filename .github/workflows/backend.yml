name: Backend

# The backend test suite (backend/tests, ~30 files; UX1, PLAN_TECH §3) on
# every change to the backend or the code it imports (src/ and the
# Premiere plugin's burn), in three parallel runs:
#   SQLite         the default: SQLite job store, media on local disk
#   Postgres       CLEO_TEST_DB=postgres: the whole suite on Postgres
#   R2 (moto)      CLEO_TEST_MEDIA=r2: every job's media in R2, faked by
#                  moto in-process
# Postgres is a service container in every run (CLEO_TEST_PG_URL;
# conftest.py makes fresh databases there): the Postgres run's suite
# database, and the test_pg_* files' own databases in all three runs.
# (pgserver, the embedded Postgres used locally, has no Python 3.13
# wheels; the one test that needs it — stopping and restarting a server
# of its own — is skipped here.)
# Includes the stub backend's smoke test (test_stub_server.py) — the web
# e2e suites run against that stub — and, once UX2 lands, the caption
# burn golden test.
#
# Locally: python -m pytest backend/tests -q (see backend/tests/conftest.py).

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'plugins/premiere/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'src/**'
      - 'plugins/premiere/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event_name }}-${{ github.ref }}
  # A new push to a PR replaces its run; every run on main finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  pytest:
    name: pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SQLite
            db: sqlite
            media: local
          - name: Postgres
            db: postgres
            media: local
          - name: R2 (moto)
            db: sqlite
            media: r2
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cleo
          POSTGRES_PASSWORD: cleo-ci
          POSTGRES_DB: cleo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleo -d cleo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CLEO_TEST_DB: ${{ matrix.db }}
      CLEO_TEST_MEDIA: ${{ matrix.media }}
      CLEO_TEST_PG_URL: postgresql://cleo:cleo-ci@localhost:5432/cleo
      # stub_media.py's generated clips (test_stub_server.py).
      STUB_MEDIA_DIR: ${{ github.workspace }}/.stub-media
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The image's Python (backend/Dockerfile).
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: System packages (as in backend/Dockerfile)
        run: >-
          .github/scripts/apt-install.sh
          ffmpeg libsndfile1 fonts-dejavu-core fonts-liberation2
      - name: Requirements
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Cache the stub media
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.stub-media
          key: stub-media-grid-${{ runner.os }}-${{ hashFiles('backend/tests/stub_media.py') }}
      - name: pytest
        run: python -m pytest backend/tests -q -p no:cacheprovider --durations=15
