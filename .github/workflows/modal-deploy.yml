name: Deploy Modal render

# Modal bundles src/, plugins/ and backend/ into the render image at
# deploy time, so every change there needs a redeploy. This does it on
# each push to main (and on demand). Needs the repo secrets
# MODAL_TOKEN_ID and MODAL_TOKEN_SECRET (same values as on Railway).

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'plugins/**'
      - '.github/workflows/modal-deploy.yml'
  workflow_dispatch:
    inputs:
      diagnose:
        description: Don't deploy; print the render app's state and recent logs
        type: boolean
        default: false

concurrency:
  group: modal-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Check Modal credentials
        id: creds
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::warning::MODAL_TOKEN_ID / MODAL_TOKEN_SECRET repo secrets are not set — skipping Modal deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.creds.outputs.ok == 'true'
        with:
          python-version: '3.12'

      - name: Diagnose
        if: steps.creds.outputs.ok == 'true' && inputs.diagnose
        # Public log: only the render app's state and error lines.
        run: |
          pip install -q "modal>=1.0"
          modal app list 2>&1 | head -20
          modal container list 2>&1 | head -20
          timeout 40 modal app logs cleocuts-render 2>&1 \
            | grep -iE "error|exception|traceback|timeout|killed|memory|oom|limit|fail|cancel|start|finish|stopp" \
            | tail -60 || true
          # Can Modal run a call at all? Fails this run with an ::error::
          # that says what to do (spend limit, tokens, deploy, no answer).
          # Probes the function the API uses (vars.CLEO_MODAL_RENDER_FN,
          # set it to render_r2 as a repo variable once Railway uses it).
          python .github/scripts/modal_probe.py --timeout 180 \
            --function "${{ vars.CLEO_MODAL_RENDER_FN || 'render_burn_concat' }}"

      - name: Deploy
        if: steps.creds.outputs.ok == 'true' && !inputs.diagnose
        # render_r2 (media in R2) needs the Modal secret "cleocuts-r2";
        # Modal resolves secrets before it publishes, so deploying it
        # without the secret would fail the WHOLE deploy — and keep the
        # old render_burn_concat live. So: with the secret, deploy both
        # (CLEO_MODAL_R2=1, see backend/modal_render.py); without it,
        # deploy render_burn_concat alone and say so. The backend falls
        # back to render_burn_concat while render_r2 is missing.
        run: |
          pip install "modal>=1.0"
          # A failed listing is not "no secret": deploying without
          # render_r2 would take it down while the API may use it.
          if ! secrets=$(modal secret list --json); then
            echo "::error title=Modal secret list failed::Could not list the Modal secrets (network / token?). Nothing deployed; re-run the workflow."
            exit 1
          fi
          if printf '%s' "$secrets" | python -c 'import json,sys; names={s.get("name") or s.get("Name") for s in json.load(sys.stdin)}; sys.exit(0 if "cleocuts-r2" in names else 1)'; then
            echo "Modal secret cleocuts-r2 found — deploying render_burn_concat and render_r2."
            export CLEO_MODAL_R2=1
          else
            echo "::warning title=render_r2 not deployed::The Modal secret cleocuts-r2 does not exist, so only render_burn_concat is deployed. Renders keep working on the volume path. To enable render_r2 create the secret (DEPLOY.md section 10.2, step 3) and re-run this workflow."
            export CLEO_MODAL_R2=0
          fi
          modal deploy backend/modal_render.py
