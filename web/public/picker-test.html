<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Video-Auswahl Test</title>
<!--
  Owner test (iPhone, 2026-10): which file-input variant hands a long video
  over without iOS's "Preparing…" wait in the Photos picker (HEVC -> H.264
  transcode or iCloud download). Nothing is uploaded; the page only shows
  what the browser gave it. Not linked anywhere.
-->
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #111; --muted: #666; --card: #f2f2f4; --accent: #6d4aff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d0d10; --fg: #f2f2f2; --muted: #9a9aa3; --card: #1b1b21; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 4px 0 8px; }
  p { color: var(--muted); margin: 0 0 16px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .card b { display: block; margin-bottom: 8px; }
  label.btn { display: inline-block; background: var(--accent); color: #fff; border-radius: 999px; padding: 12px 18px; font-weight: 600; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .out { margin-top: 10px; font-size: 14px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h1>Video-Auswahl testen</h1>
<p>Wähle beim selben Knopf <b>zweimal hintereinander dasselbe Video</b>. Die Seite vergleicht beide Auswahlen und zeigt ✅ GLEICH oder ❌ ANDERS. Es wird nichts hochgeladen.</p>

<div class="card"><b>A · wie jetzt (video/*)</b>
  <label class="btn">Video wählen<input type="file" data-v="A" accept="video/*"></label><div class="out"></div></div>

<div class="card"><b>B · ohne Filter</b>
  <label class="btn">Video wählen<input type="file" data-v="B"></label><div class="out"></div></div>

<div class="card"><b>C · Originalformate (mov, mp4, hevc)</b>
  <label class="btn">Video wählen<input type="file" data-v="C" accept="video/quicktime,video/mp4,video/hevc,.mov,.mp4,.m4v,.hevc"></label><div class="out"></div></div>

<div class="card"><b>D · alle Dateien</b>
  <label class="btn">Video wählen<input type="file" data-v="D" accept="*/*"></label><div class="out"></div></div>

<script>
  // Every pick is listed (newest first) and compared with the pick before
  // it on the same button. The value is reset after each pick, otherwise
  // Safari fires no change event when the same video is chosen again.
  // "Kennung" is the app's resume fingerprint: SHA-256 of the first and
  // last 2 MiB (web/src/lib/uploadResume.ts) — equal means "continue
  // upload" can pick up where it stopped.
  var SAMPLE = 2 * 1024 * 1024;
  function hex(buf) {
    return Array.from(new Uint8Array(buf), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }
  function kennung(f) {
    if (!window.crypto || !crypto.subtle) return Promise.resolve('(nicht verfügbar)');
    return Promise.all([
      f.slice(0, SAMPLE).arrayBuffer(),
      f.slice(Math.max(0, f.size - SAMPLE)).arrayBuffer()
    ]).then(function (parts) {
      var all = new Uint8Array(parts[0].byteLength + parts[1].byteLength);
      all.set(new Uint8Array(parts[0]), 0);
      all.set(new Uint8Array(parts[1]), parts[0].byteLength);
      return crypto.subtle.digest('SHA-256', all);
    }).then(function (d) { return hex(d).slice(0, 12); }, function () { return '(Fehler beim Lesen)'; });
  }
  document.querySelectorAll('input[type=file]').forEach(function (inp) {
    var opened = 0, n = 0, last = null;
    var out = inp.closest('.card').querySelector('.out');
    inp.addEventListener('click', function () { opened = Date.now(); });
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0];
      var secs = opened ? ((Date.now() - opened) / 1000).toFixed(0) : '?';
      if (!f) return;
      n += 1;
      var entry = document.createElement('div');
      entry.style.marginBottom = '10px';
      entry.textContent = 'Auswahl ' + n + ': wird geprüft …';
      out.insertBefore(entry, out.firstChild);
      kennung(f).then(function (k) {
        var now = { size: f.size, k: k };
        var same = last ? (last.size === now.size && last.k === now.k ? '✅ GLEICH wie Auswahl ' + (n - 1) : '❌ ANDERS als Auswahl ' + (n - 1)) : '';
        entry.textContent =
          'Auswahl ' + n + (same ? '  —  ' + same : '') + '\n' +
          'Name: ' + f.name + '\n' +
          'Typ: ' + (f.type || '(leer)') + '\n' +
          'Größe: ' + (f.size / 1048576).toFixed(1) + ' MB (' + f.size + ' Bytes)\n' +
          'Kennung: ' + k + '\n' +
          'Zeit vom Antippen bis fertig: ' + secs + ' s';
        last = now;
        inp.value = '';
      });
    });
  });
</script>
</body>
</html>
